name: daily-ping
on:
  schedule:
    - cron: "7,27,47 2,6,10,14,18,22 * * *"   # 3 tries per 4-hour slot; server skips if the slot is already uploaded
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ping.yml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake server and start the video
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then sleep 150; fi
          for i in 1 2 3 4 5; do
            out=$(curl -s -m 90 https://yt-auto-shorts.onrender.com/run) && echo "$out" && break
            sleep 30
          done
# kick 2026-11-03T18:56:48Z
# kick 2026-11-03T23:27Z cron-job.org 04:00 wake missing
