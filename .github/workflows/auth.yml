name: youtube-auth
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Google authorization code"
        required: true
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: exchange code and store refresh token as secret
        env:
          CODE: ${{ github.event.inputs.code }}
          CID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          resp=$(curl -s -X POST https://oauth2.googleapis.com/token -d "code=$CODE" -d "client_id=$CID" -d "client_secret=$CSEC" -d "redirect_uri=http://localhost" -d "grant_type=authorization_code")
          rt=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('refresh_token',''))")
          if [ -z "$rt" ]; then echo "NO REFRESH TOKEN (error shown below, no secrets):"; echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ('error','error_description')})"; exit 1; fi
          echo "::add-mask::$rt"
          gh secret set YT_REFRESH_TOKEN --body "$rt" --repo "${{ github.repository }}"
          echo "refresh token saved to secret YT_REFRESH_TOKEN"
