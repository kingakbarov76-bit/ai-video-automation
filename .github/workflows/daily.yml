name: daily-video
on:
  schedule:
    - cron: "0 3 * * *"   # 08:00 Tashkent
  workflow_dispatch:
    inputs:
      mode:
        description: "run = make and upload, check = only test Cloudflare"
        default: "run"
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python main.py "${{ github.event.inputs.mode || 'run' }}"
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: save log
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add logs/last_run.txt && git commit -m "run log" && git push || true
