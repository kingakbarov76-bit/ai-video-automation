# One command on any VPS:  docker compose up -d
services:
  shorts:
    build: .
    command: python server.py
    env_file: .env
    environment: { PORT: "10000" }
    ports: ["10000:10000"]
    restart: unless-stopped
  live:
    build: .
    command: python stream/app.py
    env_file: .env
    environment: { PORT: "7860" }
    ports: ["7860:7860"]
    restart: unless-stopped
